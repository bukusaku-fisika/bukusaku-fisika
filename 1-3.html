<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Buku Saku 1.3 Kalor dan Perubahan Suhu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Caveat:wght@600&display=swap">
<style>
/* Tata letak: satu halaman buku per layar, pita merah-emas di kepala halaman seperti aset cetak, kotak berlabel untuk tiap bagian, navigasi halaman di bawah */
:root{
  --bg:#f4ece9; --page:#fffdfb; --surface:#ffffff; --surface-2:#fbebe8; --ink:#2b1a1c; --muted:#70595b; --line:#ecd3cf;
  --brand:#a3121f; --brand-bg:#8f0f1b; --on-brand:#fff6ef; --gold:#c4923a; --paper:#fff6d8; --orange:#e2672a;
  --hot:#e04a2c; --cold:#2f7fd6; --ok:#1c7d45; --bad:#b93226; --steam:#9aa6b4;
  --oil:#d9a21b; --sand:#d9bb8c; --metal:#9aa3ab; --skin:#e8b490; --suam:#e9a85a;
  --display:"Montserrat","Arial Black",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Segoe Script",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#120a0b; --page:#1d1214; --surface:#241619; --surface-2:#301c20; --ink:#f5eae6; --muted:#bfa7a6; --line:#4a2d31;
  --brand:#ff8d90; --brand-bg:#7c131e; --on-brand:#fff1e8; --gold:#e0b565; --paper:#3a2c1c; --orange:#ff9a5c;
  --hot:#ff7350; --cold:#6aaeff; --ok:#5fd08e; --bad:#ff8674; --steam:#b9c3cf;
  --oil:#f0bd3c; --sand:#c9a774; --metal:#8b949c; --skin:#d9a07a; --suam:#f0b46a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#120a0b; --page:#1d1214; --surface:#241619; --surface-2:#301c20; --ink:#f5eae6; --muted:#bfa7a6; --line:#4a2d31;
  --brand:#ff8d90; --brand-bg:#7c131e; --on-brand:#fff1e8; --gold:#e0b565; --paper:#3a2c1c; --orange:#ff9a5c;
  --hot:#ff7350; --cold:#6aaeff; --ok:#5fd08e; --bad:#ff8674; --steam:#b9c3cf;
  --oil:#f0bd3c; --sand:#c9a774; --metal:#8b949c; --skin:#d9a07a; --suam:#f0b46a; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand-bg)}

/* ---------- kerangka buku ---------- */
.bk-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand-bg);color:var(--on-brand);border-bottom:3px solid var(--gold)}
.bk-top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bk-iconbtn{border:1.5px solid color-mix(in srgb,var(--gold) 70%,transparent);background:transparent;color:var(--on-brand);border-radius:10px;padding:6px 10px;cursor:pointer;font:700 13px var(--body);display:flex;gap:6px;align-items:center}
.bk-iconbtn svg{width:18px;height:18px}
.bk-ttl{min-width:0;flex:1}
.bk-ttl small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-ttl b{display:block;font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-pg{font-family:var(--display);font-weight:800;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bk-prog{height:4px;background:color-mix(in srgb,var(--on-brand) 18%,transparent)}
.bk-prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .35s ease}

.bk-stage{max-width:820px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));perspective:1600px}
.bk-page{background:var(--page);border:1px solid var(--line);border-radius:6px 18px 18px 6px;box-shadow:0 18px 40px -26px color-mix(in srgb,var(--brand-bg) 60%,transparent),inset 6px 0 10px -8px color-mix(in srgb,var(--ink) 30%,transparent);overflow:hidden;transform-origin:left center}
.bk-page[hidden]{display:none}
.bk-page.in-next{animation:turnIn .45s ease both}
.bk-page.in-prev{animation:turnBack .45s ease both}
@keyframes turnIn{from{opacity:.2;transform:rotateY(-14deg) translateX(30px)}to{opacity:1;transform:none}}
@keyframes turnBack{from{opacity:.2;transform:rotateY(10deg) translateX(-30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.bk-page.in-next,.bk-page.in-prev{animation:none}}

.bk-band{background:linear-gradient(115deg,var(--brand-bg) 0 58%,transparent 58.2%),linear-gradient(115deg,transparent 0 57%,var(--gold) 57.2% 58.6%,transparent 58.8%);color:var(--on-brand);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 18px 16px}
.bk-band small{display:block;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
.bk-band b{display:block;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.06em;color:var(--gold);line-height:1}
.bk-band span{font-size:12.5px}
.bk-band .num{font-family:var(--display);font-weight:900;font-size:26px;color:var(--brand);line-height:1;align-self:center}

.bk-body{padding:6px 22px 26px;display:flex;flex-direction:column;gap:18px}
@media (max-width:520px){.bk-body{padding:4px 14px 22px}.bk-band{padding:10px 14px 14px}}
.bk-foot{display:flex;justify-content:space-between;gap:12px;padding:10px 22px;border-top:3px solid var(--gold);background:linear-gradient(90deg,var(--brand-bg),color-mix(in srgb,var(--brand-bg) 80%,var(--gold)));color:var(--on-brand);font-size:12px}
.bk-foot i{font-style:italic;opacity:.9}

.bk-hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:start}
.bk-kick{display:flex;align-items:center;gap:10px;font:800 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.bk-chip{background:var(--brand-bg);color:var(--on-brand);font:900 15px var(--display);letter-spacing:0;padding:4px 9px;border-radius:4px;box-shadow:2px 2px 0 var(--gold)}
.bk-h{font-family:var(--display);font-weight:900;font-size:clamp(30px,7vw,48px);line-height:1;letter-spacing:-.02em;margin:8px 0 0;text-wrap:balance;color:color-mix(in srgb,var(--ink) 78%,var(--muted))}
.bk-h em{font-style:normal;color:var(--brand)}
.bk-lead{margin:8px 0 0;max-width:62ch;font-size:16.5px}
.bk-sticky{font-family:var(--hand);font-size:22px;line-height:1.1;color:var(--brand);background:var(--paper);padding:12px 14px 14px;max-width:12ch;transform:rotate(3deg);box-shadow:0 8px 16px -10px color-mix(in srgb,var(--ink) 50%,transparent);border-bottom:2px solid var(--gold)}
@media (max-width:600px){.bk-hd{grid-template-columns:1fr}.bk-sticky{max-width:none;transform:rotate(-1deg);font-size:20px}}

.bk-box{border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.bk-lbl{align-self:flex-start;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--brand-bg),var(--orange));color:#fff;font:800 13.5px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:7px 18px 7px 12px;border-radius:14px 0 14px 0;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.bk-lbl.warn{background:linear-gradient(90deg,var(--bad),var(--orange))}
.bk-lbl.tip{background:linear-gradient(90deg,var(--orange),var(--gold))}
.bk-in{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bk-in p{margin:0;max-width:66ch}
.bk-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bk-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.bk-grid2,.bk-grid3{grid-template-columns:1fr}}
.bk-ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.bk-ul li::marker{color:var(--brand)}
.bk-muted{color:var(--muted);font-size:14.5px}
.bk-img{width:100%;height:auto;max-height:300px;border-radius:10px;display:block;object-fit:cover}
.bk-hex{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);max-width:260px;justify-self:end}
.bk-kw{display:flex;flex-wrap:wrap;gap:6px}
.bk-kw span{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:14px;font-weight:600}
.bk-hl{color:var(--brand);font-weight:800}
.bk-big{font-family:var(--display);font-weight:800;font-size:clamp(19px,3.4vw,24px);color:var(--brand);line-height:1.25;margin:0;text-wrap:balance}

/* ---------- komponen interaktif ---------- */
.bk-btn{border:0;border-radius:10px;padding:9px 16px;font:700 15px var(--body);cursor:pointer;background:var(--brand-bg);color:var(--on-brand)}
.bk-btn.alt{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.bk-btn:disabled{opacity:.45;cursor:not-allowed}
.bk-btn:focus-visible,.bk-iconbtn:focus-visible,.bk-opt:focus-within,.bk-flip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bk-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bk-ta{width:100%;min-height:76px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.bk-ta.ruled{background-image:repeating-linear-gradient(transparent 0 27px,color-mix(in srgb,var(--orange) 35%,transparent) 27px 28px);line-height:28px;background-attachment:local}
.bk-field{display:flex;flex-direction:column;gap:6px}
.bk-field>label{font-weight:700}
.bk-num{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bk-num input{width:120px;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.bk-fb{padding:10px 14px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--gold);max-width:66ch}
.bk-fb.ok{border-color:var(--ok)}.bk-fb.bad{border-color:var(--bad)}
.bk-fb:empty{display:none}
.bk-q{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.bk-qn{display:flex;gap:10px;align-items:flex-start}
.bk-qn>b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-bg);color:var(--on-brand);display:grid;place-items:center;font:800 14px var(--display)}
.bk-qn>div{min-width:0;flex:1;display:flex;flex-direction:column;gap:10px}
.bk-qtype{font:800 11.5px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.bk-opts{display:flex;flex-direction:column;gap:6px}
.bk-opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.bk-opt:has(input:checked){border-color:var(--brand);background:var(--surface-2)}
.bk-opt input{margin-top:5px;accent-color:var(--brand)}
.bk-opt b{font-family:var(--display);color:var(--brand);min-width:1.2em}
.bk-rate{display:flex;flex-wrap:wrap;gap:6px}
.bk-rate button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font:600 14px var(--body);color:var(--ink)}
.bk-rate button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-bg);color:var(--on-brand)}
.bk-model{background:var(--paper);border-radius:4px 14px 14px 14px;padding:12px 14px;max-width:66ch}
.bk-model b{font-family:var(--hand);font-size:21px;color:var(--brand);display:block;line-height:1}
.bk-sent{font-size:13px;color:var(--ok);font-weight:700}
.bk-check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer}
.bk-check input{width:20px;height:20px;accent-color:var(--orange);margin-top:2px;flex:none}
.bk-check:has(input:checked){background:var(--surface-2)}
.bk-pills{display:flex;flex-wrap:wrap;gap:6px}
.bk-pills button{border:1.5px dashed var(--gold);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font:600 14px var(--body);color:var(--ink)}
.bk-pills button[aria-pressed="true"]{border-style:solid;background:var(--paper);border-color:var(--brand)}

/* partikel & skala */
.bk-cv{width:100%;height:auto;display:block;border-radius:12px;background:var(--surface-2)}
.bk-slider{display:flex;flex-direction:column;gap:4px}
.bk-slider label{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px}
.bk-slider output{color:var(--brand);font-variant-numeric:tabular-nums}
.bk-slider input{width:100%;accent-color:var(--brand)}
.bk-flow{display:flex;flex-direction:column;gap:6px}
.bk-flow div{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-weight:600}
.bk-flow span{align-self:center;color:var(--brand);font-weight:800;line-height:1}
.bk-flips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.bk-flips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bk-flip{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink);font:inherit;min-width:0}
.bk-flip h4{margin:0;font:800 14.5px var(--display);display:flex;gap:6px;align-items:center}
.bk-flip h4 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--brand-bg);color:var(--on-brand);display:grid;place-items:center;font-size:12px;flex:none}
.bk-flip .back{display:none;font-size:14px;flex-direction:column;gap:6px}
.bk-flip[aria-expanded="true"] .back{display:flex}
.bk-flip[aria-expanded="true"] .front-img{display:none}
.bk-flip .tap{font-size:12.5px;color:var(--orange);font-weight:700}
.bk-flip .back b{color:var(--brand)}
.bk-tbl{overflow-x:auto}
.bk-tbl table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.bk-tbl th,.bk-tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.bk-tbl th{background:var(--brand-bg);color:var(--on-brand)}
.bk-tbl td:first-child,.bk-tbl th:first-child{text-align:left}
.bk-scales{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.bk-scales{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bk-scales div{background:var(--surface-2);border-radius:10px;padding:8px 10px;text-align:center;min-width:0}
.bk-scales span{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.bk-scales b{font:800 20px var(--display);font-variant-numeric:tabular-nums;color:var(--brand);overflow-wrap:anywhere}
.bk-pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bk-pic{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink);font:inherit;text-align:center}
.bk-pic[aria-pressed="true"]{border-color:var(--brand);background:var(--surface-2)}
.bk-pic img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.bk-pic b{font-size:13.5px}
.bk-formula{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:italic;font-size:22px;line-height:2}
.bk-frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;vertical-align:middle;margin:0 2px}
.bk-frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.bk-formula sub{font-size:.6em}
.bk-main{background:var(--brand-bg);color:var(--on-brand)}
.bk-main .bk-formula{font-size:clamp(24px,5vw,32px);color:var(--paper);text-align:center;padding-block:6px}
.bk-main .bk-in p,.bk-main dl{color:var(--on-brand)}
.bk-dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:14.5px}
.bk-dl dt{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}
.bk-dl dd{margin:0}
.bk-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bk-steps>div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bk-steps>div[hidden]{display:none}
.bk-steps h5{margin:0;font:800 13.5px var(--display);color:var(--brand);display:flex;gap:6px;align-items:center}
.bk-steps h5 i{font-style:normal;background:var(--brand-bg);color:var(--on-brand);border-radius:6px;padding:1px 6px;font-size:12px}
.bk-answer{background:var(--paper);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font:800 20px var(--display);color:var(--brand);text-align:center}
.bk-sort{display:flex;flex-direction:column;gap:8px}
.bk-sort>div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.bk-sort>div.ok{border-color:var(--ok)}.bk-sort>div.bad{border-color:var(--bad)}
.bk-sort button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font:700 13.5px var(--body);cursor:pointer;color:var(--ink)}
.bk-sort button[aria-pressed="true"].s{background:var(--cold);border-color:var(--cold);color:#fff}
.bk-sort button[aria-pressed="true"].k{background:var(--hot);border-color:var(--hot);color:#fff}
@media (max-width:460px){.bk-sort>div{grid-template-columns:1fr 1fr}.bk-sort>div>span{grid-column:1/-1}}
.bk-bar{position:relative;height:56px;border-radius:12px;overflow:hidden;background:linear-gradient(90deg,var(--hot),var(--cold))}
.bk-bar i{position:absolute;top:50%;width:18px;height:3px;background:#fff;border-radius:2px;animation:flow 2.4s linear infinite}
.bk-bar i::after{content:"";position:absolute;right:-5px;top:-4px;border:5.5px solid transparent;border-left:7px solid #fff}
@keyframes flow{from{left:8%;opacity:0}15%{opacity:1}85%{opacity:1}to{left:88%;opacity:0}}
@media (prefers-reduced-motion: reduce){.bk-bar i{animation:none;left:45%}}
.bk-video{position:relative;border-radius:14px;overflow:hidden;background:#1a0f10;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;color:#fff;text-align:center}
.bk-video button{border:0;background:var(--brand-bg);color:#fff;border-radius:999px;width:68px;height:68px;cursor:pointer;display:grid;place-items:center}
.bk-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bk-video p{margin:8px 16px 0;font-size:14px;opacity:.85}
.bk-emoji{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bk-emoji button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12.5px var(--body);color:var(--ink);line-height:1.2}
.bk-emoji button[aria-pressed="true"]{border-color:var(--brand);background:var(--surface-2)}
.bk-emoji svg{width:30px;height:30px}
.bk-srow{display:flex;flex-direction:column;gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
.bk-srow:last-child{border-bottom:0}

/* sampul */
.bk-cover{background:radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--gold) 35%,transparent),transparent 60%),var(--brand-bg);color:var(--on-brand);padding:28px 22px;display:flex;flex-direction:column;gap:16px}
.bk-cover small{letter-spacing:.2em;text-transform:uppercase;font-size:12px;opacity:.85}
.bk-cover h1{margin:0;font:900 clamp(40px,10vw,68px)/.95 var(--display);color:var(--gold);letter-spacing:.02em}
.bk-cover h2{margin:0;font:800 clamp(20px,4.5vw,28px) var(--display)}
.bk-cover p{margin:0;max-width:56ch;opacity:.95}
.bk-cover .bk-hand{font-family:var(--hand);font-size:26px;color:var(--paper)}
.bk-login{background:var(--page);color:var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.bk-login input{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);font:inherit;width:min(260px,100%)}
.bk-login .bk-row label{font-weight:700;display:flex;flex-direction:column;gap:4px}

/* navigasi bawah & daftar isi */

<script src="config.js"></script>
<script>
window.BK_SUBBAB='1.3';
/* =====================================================================
   Pengaturan bersama (ENDPOINT, ID video) ada di file config.js.
   ===================================================================== */
const SUBBABS = [
  { no: '1.1', judul: 'Suhu dan Termometer', file: 'index.html' },
  { no: '1.2', judul: 'Pemuaian Termal', file: '1-2.html' },
  { no: '1.3', judul: 'Kalor dan Perubahan Suhu', file: '1-3.html' },
  { no: '1.4', judul: 'Asas Black', file: '1-4.html' },
  { no: '1.5', judul: 'Kalor Laten dan Perubahan Wujud', file: '1-5.html' },
  { no: '1.6', judul: 'Perpindahan Kalor', file: '1-6.html' }
];
const BKC = window.BK_CONFIG || {};
const SUB = SUBBABS.find(s => s.no === window.BK_SUBBAB) || SUBBABS[0];
const CONFIG = {
  ENDPOINT: BKC.ENDPOINT || '',
  BUKU: BKC.BUKU || 'Suhu dan Kalor (Edisi Uji Coba)',
  SUBBAB: SUB.no, JUDUL: SUB.judul,
  VIDEO: { id: (BKC.VIDEO || {})[SUB.no] || '', judul: SUB.judul }
};
const SUB_NEXT = SUBBABS[SUBBABS.indexOf(SUB) + 1] || null;

/* ---------- utilitas ---------- */
const bq = (s, r = document) => r.querySelector(s), bqa = (s, r = document) => [...r.querySelectorAll(s)];
/* kode, kelas, dan antrian dipakai bersama semua subbab; data lain disimpan per subbab */
const LSKEY = k => ['kode', 'kelas', 'antrian'].includes(k) || CONFIG.SUBBAB === '1.1' ? 'bukusaku:' + k : 'bukusaku:' + CONFIG.SUBBAB + ':' + k;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(LSKEY(k)); return v == null ? d : JSON.parse(v) } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(LSKEY(k), JSON.stringify(v)) } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (v, d = 1) => Number(v).toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: d });
const parseNum = s => { s = String(s).trim().replace(/\s/g, ''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); return Number(s) };
const slider = (id, label, min, max, step, val, unit) => `<div class="bk-slider"><label for="bk-${id}">${label} <output id="bk-${id}o">${val} ${unit}</output></label><input type="range" id="bk-${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- pengiriman data ke Google Sheets ---------- */
const BK = window.BK = {
  kode: () => LS.get('kode', ''),
  kelas: () => LS.get('kelas', ''),
  send(jenis, item, data) {
    const q = LS.get('antrian', []);
    q.push({ waktu: new Date().toISOString(), kode: BK.kode(), kelas: BK.kelas(), buku: CONFIG.BUKU, subbab: CONFIG.SUBBAB, jenis, item, data });
    LS.set('antrian', q); BK.flush();
  },
  async flush() {
    const q = LS.get('antrian', []);
    if (!q.length || !CONFIG.ENDPOINT || !navigator.onLine) { syncNote(); return }
    try {
      await fetch(CONFIG.ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(q) });
      const now = LS.get('antrian', []); LS.set('antrian', now.slice(q.length));
    } catch (e) {}
    syncNote();
  }
};
addEventListener('online', () => BK.flush());
function syncNote() {
  const el = bq('#bk-sync'); if (!el) return;
  const n = LS.get('antrian', []).length;
  el.innerHTML = `<div><b>Kode siswa:</b> ${esc(BK.kode() || 'belum diisi')}${BK.kelas() ? ' · ' + esc(BK.kelas()) : ''}</div>` +
    (n ? `<div>${n} jawaban tersimpan di perangkat ini dan akan dikirim ke guru ${CONFIG.ENDPOINT ? 'saat ada sinyal' : 'setelah pengiriman diaktifkan guru'}.</div>` : `<div>Semua jawaban sudah terkirim.</div>`) +
    `<button class="bk-btn alt" id="bk-gantikode">Ganti kode siswa</button>`;
  bq('#bk-gantikode').onclick = () => { closeToc(); go(0) };
}

/* ---------- komponen ---------- */
const box = (label, inner, cls = '') => `<section class="bk-box ${cls}"><div class="bk-lbl ${cls.includes('warn') ? 'warn' : cls.includes('tip') ? 'tip' : ''}">${label}</div><div class="bk-in">${inner}</div></section>`;
const header = (kick, h, lead, note) => `<div class="bk-hd"><div><div class="bk-kick"><span class="bk-chip">${CONFIG.SUBBAB}</span>${kick}</div><h2 class="bk-h">${h}</h2>${lead ? `<p class="bk-lead">${lead}</p>` : ''}</div>${note ? `<div class="bk-sticky">${note}</div>` : ''}</div>`;
const frac = (a, b) => `<span class="bk-frac"><span>${a}</span><span>${b}</span></span>`;

/* pilihan ganda dengan umpan balik per pilihan */
function mcq(id, no, soal, opsi, kunci, umpan, send = true) {
  return `<div class="bk-q" data-mcq="${id}"><div class="bk-qn"><b>${no}</b><div><span class="bk-qtype">Pilihan ganda</span><p style="margin:0">${soal}</p>
  <div class="bk-opts">${opsi.map((o, i) => `<label class="bk-opt"><input type="radio" name="${id}" value="${i}"><b>${'ABCDE'[i]}.</b><span>${o}</span></label>`).join('')}</div>
  <div class="bk-row"><button class="bk-btn alt" data-cek>Periksa jawaban</button></div><div class="bk-fb" data-fb></div></div></div></div>`;
}
function initMcq(el) {
  const id = el.dataset.mcq, def = MCQ[id], btn = bq('[data-cek]', el), fb = bq('[data-fb]', el);
  const saved = LS.get('mcq:' + id, null);
  if (saved) { const r = bq(`input[value="${saved.pilih}"]`, el); if (r) r.checked = true }
  btn.onclick = () => {
    const r = bq('input:checked', el); if (!r) { fb.className = 'bk-fb'; fb.textContent = 'Pilih salah satu jawaban dulu.'; return }
    const p = +r.value, ok = p === def.kunci, first = LS.get('mcq:' + id, null);
    fb.className = 'bk-fb ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = `<b>${ok ? 'Tepat.' : 'Belum tepat.'}</b> ${def.umpan[p]}${ok ? '' : ' Coba lagi.'}`;
    if (!first) { LS.set('mcq:' + id, { pilih: p, benar: ok }); if (def.send) BK.send('pilihan_ganda', id, { pilihan: 'ABCDE'[p], benar: ok, percobaan: 'pertama' }) }
    else if (ok && !first.benar) { LS.set('mcq:' + id, { pilih: p, benar: true, ulang: true }); if (def.send) BK.send('pilihan_ganda', id, { pilihan: 'ABCDE'[p], benar: true, percobaan: 'ulang' }) }
    updateScore();
  };
}

/* isian angka dengan petunjuk bertahap */
function num(id, label, unit) {
  return `<div class="bk-field" data-num="${id}"><label for="n-${id}">${label}</label><div class="bk-num"><input id="n-${id}" inputmode="decimal" autocomplete="off" placeholder="jawaban"><span>${unit}</span><button class="bk-btn alt" data-cek>Periksa</button></div><div class="bk-fb" data-fb></div></div>`;
}
function initNum(el) {
  const id = el.dataset.num, def = NUM[id], inp = bq('input', el), fb = bq('[data-fb]', el), btn = bq('[data-cek]', el);
  let salah = 0; inp.value = LS.get('num:' + id, '');
  inp.oninput = () => LS.set('num:' + id, inp.value);
  inp.onkeydown = e => { if (e.key === 'Enter') btn.click() };
  btn.onclick = () => {
    const v = parseNum(inp.value);
    if (isNaN(v)) { fb.className = 'bk-fb'; fb.textContent = 'Tulis jawabanmu dalam bentuk angka, misalnya 64,4.'; return }
    const ok = Math.abs(v - def.ans) <= (def.tol ?? Math.max(0.05, Math.abs(def.ans) * 0.01));
    if (def.send && !LS.get('numsent:' + id, false)) { LS.set('numsent:' + id, true); BK.send('isian_angka', id, { jawaban: v, benar: ok }) }
    if (ok) { fb.className = 'bk-fb ok'; fb.innerHTML = `<b>Tepat.</b> ${def.sol}` }
    else { salah++; fb.className = 'bk-fb bad'; fb.innerHTML = salah >= 3 ? `<b>Pembahasan.</b> ${def.sol}` : `<b>Belum tepat.</b> ${def.hints[Math.min(salah - 1, def.hints.length - 1)]}` }
  };
}

/* uraian: tulis dulu, lalu bandingkan dengan jawaban contoh dan nilai sendiri */
function openQ(id, no, soal, opt = {}) {
  return `<div class="bk-q" data-open="${id}"><div class="bk-qn"><b>${no}</b><div>${opt.type ? `<span class="bk-qtype">${opt.type}</span>` : ''}<label for="t-${id}" style="font-weight:600">${soal}</label>
  <textarea class="bk-ta ruled" id="t-${id}" placeholder="Tulis jawabanmu dengan kalimatmu sendiri."></textarea>
  <div class="bk-row"><button class="bk-btn alt" data-kirim>${OPEN[id].model ? 'Kirim dan bandingkan' : 'Kirim jawaban'}</button><span class="bk-sent" data-st></span></div>
  <div data-after hidden>${OPEN[id].model ? `<div class="bk-model"><b>Contoh jawaban</b>${OPEN[id].model}</div><p class="bk-muted" style="margin:0">Bandingkan dengan jawabanmu. Menurutmu jawabanmu…</p><div class="bk-rate">${['Sudah sesuai', 'Sebagian sesuai', 'Belum sesuai'].map(r => `<button aria-pressed="false">${r}</button>`).join('')}</div>` : ''}</div></div></div></div>`;
}
function initOpen(el) {
  const id = el.dataset.open, ta = bq('textarea', el), st = bq('[data-st]', el), after = bq('[data-after]', el);
  ta.value = LS.get('open:' + id, ''); ta.oninput = () => LS.set('open:' + id, ta.value);
  const sent = LS.get('opensent:' + id, null);
  if (sent) { after.hidden = false; st.textContent = 'Terkirim'; markRate(el, sent.nilai) }
  bq('[data-kirim]', el).onclick = () => {
    if (ta.value.trim().length < 5) { st.style.color = 'var(--bad)'; st.textContent = 'Tulis jawabanmu dulu.'; return }
    st.style.color = ''; st.textContent = 'Terkirim'; after.hidden = false;
    LS.set('opensent:' + id, { nilai: (LS.get('opensent:' + id, {}) || {}).nilai || null });
    BK.send('uraian', id, { jawaban: ta.value.trim() });
  };
  bqa('.bk-rate button', el).forEach(b => b.onclick = () => {
    markRate(el, b.textContent); LS.set('opensent:' + id, { nilai: b.textContent });
    BK.send('nilai_diri', id, { nilai: b.textContent });
  });
}

const KMD = [

  ['Saya menunda belajar fisika sampai mendekati hari ulangan.', 'Disiplin', -1],

  ['Saya mengerjakan tugas fisika sampai selesai walaupun guru tidak memeriksanya.', 'Tanggung jawab', 1],
  ['Saya cepat berhenti belajar fisika ketika materinya mulai terasa sulit.', 'Motivasi', -1],
  ['Saya belajar fisika pada waktu yang sudah saya rencanakan sendiri, meskipun tidak ada tugas atau ulangan.', 'Disiplin', 1],
  ['Saya baru membuka catatan fisika ketika ada tugas atau ulangan.', 'Inisiatif', -1],
  ['Setelah ulangan, saya memeriksa kembali soal yang salah untuk mengetahui penyebabnya.', 'Evaluasi diri', 1],
  ['Saya memilih melewati soal fisika yang terlihat sulit tanpa mencobanya.', 'Kepercayaan diri', -1],

  ['Saya menyalin jawaban tugas fisika dari teman ketika waktunya mepet.', 'Tanggung jawab', -1]
];
const SKALA4 = [['SS', 'Sangat setuju'], ['S', 'Setuju'], ['TS', 'Tidak setuju'], ['STS', 'Sangat tidak setuju']];
function angketHTML() {
  return `<p style="margin:0">Pilih jawaban yang paling sesuai dengan <b>kebiasaanmu selama ini</b>, bukan yang menurutmu seharusnya. Tidak ada jawaban benar atau salah, dan jawabanmu tidak memengaruhi nilai.</p>
  <p class="bk-muted" style="margin:0">SS = sangat setuju · S = setuju · TS = tidak setuju · STS = sangat tidak setuju</p>
  <ol class="bk-likert" id="bk-angket">${KMD.map((k, i) => `<li data-i="${i}"><span>${k[0]}</span><div class="bk-lk" role="radiogroup" aria-label="Pernyataan ${i + 1}">${SKALA4.map((s, j) => `<button role="radio" aria-checked="false" data-v="${j}" title="${s[1]}">${s[0]}</button>`).join('')}</div></li>`).join('')}</ol>
  <div class="bk-lkpg"><button class="bk-btn alt" id="bk-lkprev">‹ Sebelumnya</button><b id="bk-lkpos">Butir 1–4 dari 12</b><button class="bk-btn" id="bk-lknext">Berikutnya ›</button><button class="bk-btn" id="bk-kirimangket">Kirim angket</button></div><span class="bk-sent" id="bk-angst"></span>`;
}
function initAngket() {
  const st = LS.get('angket', {});
  bqa('#bk-angket li').forEach(li => {
    const i = li.dataset.i; const mark = v => bqa('button', li).forEach(b => b.setAttribute('aria-checked', b.dataset.v == v));
    if (st[i] != null) mark(st[i]);
    bqa('button', li).forEach(b => b.onclick = () => { mark(b.dataset.v); st[i] = +b.dataset.v; LS.set('angket', st); li.classList.remove('miss') });
  });
  let grp = 0; const lis = bqa('#bk-angket li');
  const showGrp = g => { grp = Math.max(0, Math.min(2, g)); lis.forEach((li, i) => li.hidden = Math.floor(i / 4) !== grp); bq('#bk-lkpos').textContent = `Butir ${grp * 4 + 1}–${grp * 4 + 4} dari 12`; bq('#bk-lkprev').hidden = grp === 0; bq('#bk-lknext').hidden = grp === 2; bq('#bk-kirimangket').hidden = grp !== 2; const pn = bq('#bk-angket').closest('.bk-panel'); if (pn) pn.scrollTop = 0 };
  bq('#bk-lkprev').onclick = () => showGrp(grp - 1); bq('#bk-lknext').onclick = () => showGrp(grp + 1); showGrp(0);
  if (LS.get('angketsent', false)) bq('#bk-angst').textContent = 'Angket sudah terkirim. Kamu boleh mengubah dan mengirim ulang.';
  bq('#bk-kirimangket').onclick = () => {
    const kosong = KMD.map((k, i) => st[i] == null ? i : -1).filter(i => i >= 0);
    bqa('#bk-angket li').forEach(li => li.classList.toggle('miss', kosong.includes(+li.dataset.i)));
    if (kosong.length) { showGrp(Math.floor(kosong[0] / 4)); bq('#bk-angst').style.color = 'var(--bad)'; bq('#bk-angst').textContent = `Masih ada ${kosong.length} pernyataan yang belum dijawab (bertanda merah).`; return }
    const skor = KMD.map((k, i) => k[2] > 0 ? 4 - st[i] : st[i] + 1);
    const data = { skor_total: skor.reduce((a, b) => a + b, 0), skor_maks: KMD.length * 4 };
    KMD.forEach((k, i) => { data['butir_' + (i + 1)] = SKALA4[st[i]][0] + ' (skor ' + skor[i] + ', ' + k[1].toLowerCase() + ')' });
    BK.send('angket_kemandirian', 'akhir_subbab_' + CONFIG.SUBBAB, data);
    LS.set('angketsent', true); bq('#bk-angst').style.color = ''; bq('#bk-angst').textContent = 'Angket terkirim. Terima kasih!'; refreshTiles();
  };
}

const sorter = (id, items, groups) => `<div class="bk-sort bk-sortn" id="bk-${id}" style="--n:${groups.length}">${items.map((s, i) => `<div data-i="${i}"><span>${s[0]}</span>${groups.map((g, j) => `<button data-g="${j}" aria-pressed="false">${g}</button>`).join('')}</div>`).join('')}</div><div class="bk-row"><button class="bk-btn alt" data-sortck="${id}">Periksa</button></div><div class="bk-fb" id="bk-${id}fb"></div>`;
function initSorter(id, items, sendItem) {
  const st = LS.get('sort:' + id, {});
  bqa(`#bk-${id} > div`).forEach(r => { const i = r.dataset.i; if (st[i] != null) bq(`[data-g="${st[i]}"]`, r).setAttribute('aria-pressed', true);
    bqa('button', r).forEach(b => b.onclick = () => { bqa('button', r).forEach(x => x.setAttribute('aria-pressed', x === b)); r.className = ''; st[i] = +b.dataset.g; LS.set('sort:' + id, st) }) });
  bq(`[data-sortck="${id}"]`).onclick = () => {
    let n = 0, isi = 0; bqa(`#bk-${id} > div`).forEach(r => { const p = bq('[aria-pressed="true"]', r); if (!p) { r.className = ''; return } isi++; const ok = +p.dataset.g === items[r.dataset.i][1]; n += ok; r.className = ok ? 'ok' : 'bad' });
    const fb = bq(`#bk-${id}fb`);
    if (isi < items.length) { fb.className = 'bk-fb'; fb.textContent = `Masih ada ${items.length - isi} pernyataan yang belum kamu pilih.`; return }
    fb.className = 'bk-fb ' + (n === items.length ? 'ok' : 'bad');
    fb.innerHTML = n === items.length ? '<b>Semua tepat.</b>' : `<b>${n} dari ${items.length} tepat.</b> Perbaiki yang bergaris merah, lalu periksa lagi.`;
    if (!LS.get('sortsent:' + id, false)) { LS.set('sortsent:' + id, true); BK.send('klasifikasi', sendItem, { benar: n, dari: items.length }) }
  };
}

}
function table(){
  const L=cur;
  $('#tw').innerHTML=L.rows.length?`<table><thead><tr><th>No</th>${L.cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${L.rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map(c=>`<td>${c}</td>`).join('')}<td><button data-i="${i}" aria-label="Hapus baris ${i+1}">×</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">Belum ada data. Atur percobaan, lalu tekan "Catat data".</div>`;
  if(L.plot){const pts=L.pts.filter(p=>p.length).map(p=>[p[L.plot.x],p[L.plot.y]]);const [x0,x1]=span(pts.map(p=>p[0]),1.15),[y0,y1]=span(pts.map(p=>p[1]),1.15);chart($('#plot'),{xmin:x0,xmax:x1,ymin:y0,ymax:y1,xl:L.plot.xl,yl:L.plot.yl,series:[{pts,dots:1}]})}
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const L=cur;
  if(L){if(L.timed&&L.s.run){L.step(L.s,dt*L.timed);refresh()}else if(L.tick)L.tick(L.s,dt)}
  requestAnimationFrame(loop)}

$('#copy').onclick=()=>{
  const L=cur,p=store.get('pred'+L.id,null),v=id=>($('#'+id)||{}).value||'-';
  const txt=[`LAPORAN LAB VIRTUAL KALOR — Percobaan ${L.no}: ${L.title}`,`Nama/kelas: ${who.value||'-'}`,``,`FENOMENA: ${L.phen.q}`,`Dugaan awal: ${v('p0')}`,``,`Pertanyaan penyelidikan: ${L.ask}`,`Prediksi: ${p==null?'-':L.predict.opts[p]}`,``,`DATA`,['No',...L.cols].join('\t'),...L.rows.map((r,i)=>[i+1,...r].join('\t')),``,`ANALISIS`,...L.qs.map((q,i)=>`${i+1}. ${q}\n   Jawab: ${v('a'+i)}`),`Kesimpulan: ${v('a9')}`,``,`PENERAPAN SEHARI-HARI`,...L.apply.map((q,i)=>`${i+1}. ${q}\n   Jawab: ${v('b'+i)}`)].join('\n');
  const fb=()=>{const r=$('#rep');r.hidden=false;r.value=txt;r.focus();r.select();$('#copymsg').textContent='Salin teks di bawah ini secara manual.'};
  try{navigator.clipboard.writeText(txt).then(()=>{$('#copymsg').textContent='Laporan tersalin. Tempel ke tugasmu.'},fb)}catch(e){fb()}
};
$('#kirimlab').onclick=()=>{const L=cur,p=store.get('pred'+L.id,null),v=id=>($('#'+id)||{}).value||'-';const txt=[`LAPORAN LAB VIRTUAL KALOR — Percobaan ${L.no}: ${L.title}`,`Nama/kelas: ${who.value||'-'}`,``,`FENOMENA: ${L.phen.q}`,`Dugaan awal: ${v('p0')}`,``,`Pertanyaan penyelidikan: ${L.ask}`,`Prediksi: ${p==null?'-':L.predict.opts[p]}`,``,`DATA`,['No',...L.cols].join('\t'),...L.rows.map((r,i)=>[i+1,...r].join('\t')),``,`ANALISIS`,...L.qs.map((q,i)=>`${i+1}. ${q}\n   Jawab: ${v('a'+i)}`),`Kesimpulan: ${v('a9')}`,``,`PENERAPAN SEHARI-HARI`,...L.apply.map((q,i)=>`${i+1}. ${q}\n   Jawab: ${v('b'+i)}`)].join('\n');if(L.rows.length<3){$('#copymsg').textContent='Catat minimal tiga data di langkah 4 sebelum mengirim.';return}BK.send('lab','percobaan_'+L.no,{laporan:txt});$('#copymsg').textContent='Laporan terkirim ke guru. Kamu masih bisa memperbaiki dan mengirim ulang.'};
show(LABID);requestAnimationFrame(loop);BK.labTiles();
})();
</script>
</body></html>
